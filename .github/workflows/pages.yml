name: Deploy menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate menu
        run: node scripts/validate_menu.mjs

      - name: Scan menu for PII
        run: python3 scripts/pii_scan.py data/waffle_menu.csv

      # Publish only the customer-facing site; drop the internal cost column from the public CSV.
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js menu.js _site/
          python3 - <<'PY'
          import csv
          with open("data/waffle_menu.csv", newline="", encoding="utf-8") as src, \
               open("_site/data/waffle_menu.csv", "w", newline="", encoding="utf-8") as dst:
              reader = csv.DictReader(src)
              fields = [f for f in reader.fieldnames if f != "cost_usd"]
              writer = csv.DictWriter(dst, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              for row in reader:
                  writer.writerow({f: row[f] for f in fields})
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
